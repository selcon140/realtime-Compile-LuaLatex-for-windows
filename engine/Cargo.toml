[package]
name = "realtime-tex-server"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tree-sitter = "0.25"
codebook-tree-sitter-latex = "0.6"
regex = "1"
flate2 = "1"
